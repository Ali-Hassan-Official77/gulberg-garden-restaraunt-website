<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D372"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8E6A0F"/>
    </linearGradient>

    <!-- Emerald Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4D3B"/>
      <stop offset="100%" stop-color="#0B2319"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)" filter="url(#shadow)">
    <!-- Main Decorative Arch Frame -->
    <path d="M 120 280 C 120 150, 200 80, 250 80 C 300 80, 380 150, 380 280 L 380 340 C 380 370, 320 390, 250 390 C 180 390, 120 370, 120 340 Z" 
          fill="none" stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <path d="M 135 280 C 135 165, 205 100, 250 100 C 295 100, 365 165, 365 280" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 5"/>

    <!-- Arch Top Crest / Crown Ornament -->
    <path d="M 250 45 C 235 65, 245 75, 250 80 C 255 75, 265 65, 250 45 Z" fill="url(#goldGrad)"/>
    <circle cx="250" cy="40" r="4" fill="url(#goldGrad)"/>
    <path d="M 225 70 Q 250 55 275 70" fill="none" stroke="url(#greenGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Sunburst Behind Gazebo -->
    <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="250" y1="160" x2="250" y2="140"/>
      <line x1="230" y1="165" x2="218" y2="150"/>
      <line x1="270" y1="165" x2="282" y2="150"/>
      <line x1="215" y1="180" x2="198" y2="173"/>
      <line x1="285" y1="180" x2="302" y2="173"/>
    </g>

    <!-- Central Gazebo / Pavilion -->
    <!-- Dome -->
    <path d="M 205 210 C 205 155, 295 155, 295 210 Z" fill="url(#greenGrad)"/>
    <!-- Gold Details on Dome -->
    <path d="M 250 155 L 250 210 M 225 170 C 235 190, 245 200, 250 210 M 275 170 C 265 190, 255 200, 250 210" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 250 145 L 250 155 M 245 150 L 255 150" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Pillars -->
    <rect x="212" y="210" width="8" height="65" fill="url(#goldGrad)" rx="2"/>
    <rect x="237" y="210" width="8" height="65" fill="url(#goldGrad)" rx="2"/>
    <rect x="255" y="210" width="8" height="65" fill="url(#goldGrad)" rx="2"/>
    <rect x="280" y="210" width="8" height="65" fill="url(#goldGrad)" rx="2"/>

    <!-- Arches between Pillars -->
    <path d="M 212 220 Q 222 212 237 220 M 237 220 Q 246 212 255 220 M 255 220 Q 267 212 280 220" 
          fill="none" stroke="url(#greenGrad)" stroke-width="3"/>

    <!-- Base / Steps -->
    <rect x="200" y="275" width="100" height="8" fill="url(#greenGrad)" rx="2"/>
    <rect x="190" y="283" width="120" height="6" fill="url(#goldGrad)" rx="2"/>

    <!-- Surrounding Botanical / Floral Artwork -->
    <!-- Left Roses & Leaves Branch -->
    <g fill="url(#greenGrad)">
      <!-- Leaves -->
      <path d="M 125 310 C 100 290, 110 250, 140 240 C 130 265, 135 290, 125 310 Z"/>
      <path d="M 145 230 C 120 210, 140 180, 165 185 C 155 200, 155 220, 145 230 Z"/>
      <path d="M 160 340 C 135 340, 125 370, 150 380 C 155 360, 160 350, 160 340 Z"/>
    </g>
    <!-- Left Gold Flower Accents -->
    <circle cx="130" cy="270" r="10" fill="url(#goldGrad)"/>
    <circle cx="130" cy="270" r="5" fill="#1E4D3B"/>
    <circle cx="155" cy="205" r="8" fill="url(#goldGrad)"/>

    <!-- Right Floral & Leaves Branch -->
    <g fill="url(#greenGrad)">
      <!-- Leaves -->
      <path d="M 375 310 C 400 290, 390 250, 360 240 C 370 265, 365 290, 375 310 Z"/>
      <path d="M 355 230 C 380 210, 360 180, 335 185 C 345 200, 345 220, 355 230 Z"/>
      <path d="M 340 340 C 365 340, 375 370, 350 380 C 345 360, 340 350, 340 340 Z"/>
    </g>
    <!-- Right Gold Flower Accents -->
    <circle cx="370" cy="270" r="10" fill="url(#goldGrad)"/>
    <circle cx="370" cy="270" r="5" fill="#1E4D3B"/>
    <circle cx="345" cy="205" r="8" fill="url(#goldGrad)"/>

    <!-- Bottom Center Scroll Flourish -->
    <path d="M 210 375 Q 250 405 290 375 Q 250 420 210 375 Z" fill="url(#goldGrad)"/>
    <circle cx="250" cy="382" r="5" fill="url(#greenGrad)"/>
  </g>
</svg>
